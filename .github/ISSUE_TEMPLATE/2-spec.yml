name: Spec
description: Turn an accepted intent into a spec.md. Stage 2 of the SDLC.
title: "[Spec]: "
labels: ["spec"]
body:
  - type: markdown
    attributes:
      value: |
        Open this as a sub-issue of the same Epic as the intent, only after the intent PR has
        merged. The output is `docs/sdlc/<epic>-<slug>/spec.md`, raised as a PR.

  - type: input
    id: intent
    attributes:
      label: Accepted intent
      description: Link the merged intent.md or its Intent issue.
      placeholder: "#12 or docs/sdlc/5-oauth-resource-server/intent.md"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope of the spec
      description: What this spec covers. Call out anything from the intent that's deferred.
    validations:
      required: true

  - type: checkboxes
    id: policies
    attributes:
      label: Policies the spec must address
      description: Tick each that applies. The spec must show how it's met or name the conflict.
      options:
        - label: Security baseline (secrets, dependencies, exposure)
        - label: API security (OWASP API Top 10)
        - label: MCP security (OWASP MCP Top 10)
        - label: LLM security (OWASP LLM Top 10)
        - label: Data protection (UK/EU GDPR)

  - type: textarea
    id: decisions
    attributes:
      label: Decisions needing an ADR
      description: Choices with lasting structural impact. Each becomes an ADR in the decision log.
      placeholder: |
        - Pluggable state-store interface shape
        - Token validation when a gateway has already authenticated

  - type: textarea
    id: interfaces
    attributes:
      label: Interfaces affected
      description: Public config, environment variables, exported APIs, gateway contract, MCP surface.

  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: Carried over from the intent or raised during design.
