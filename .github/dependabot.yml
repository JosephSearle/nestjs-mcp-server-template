version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Catalog releases in one PR, majors included, so they can be checked against its changelog.
      workflow-catalog:
        patterns: ["JosephSearle/workflow-catalog*"]
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-minor-patch:
        update-types: [minor, patch]

  # infra/ arrives with #23; until then Dependabot reports no files found here.
  - package-ecosystem: terraform
    directory: /infra
    schedule:
      interval: weekly
    groups:
      terraform-minor-patch:
        update-types: [minor, patch]
